<p>Reports direct Compose state writes during composition.</p>
<p>Writing state while composing can trigger backwards writes and unstable recomposition loops.</p>
<p>Move state writes into an event handler or an effect such as <code>LaunchedEffect</code>, <code>SideEffect</code>, or <code>DisposableEffect</code>.</p>
